name: Testes

on: [push, pull_request]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar e executar testes sem banco ou SMTP
        shell: bash
        run: |
          build_dir=$(mktemp -d)
          javac --release 17 -d "$build_dir" \
            Refatoracao/{Money,BillingCommand,Customer,PricingCalculator}.java \
            Refatoracao/{CustomerRepository,PaymentGateway,NotificationService}.java \
            Refatoracao/{JdbcCustomerRepository,TokenPaymentGateway,SubscriptionBillingService}.java \
            Refatoracao/tests/*.java
          java -cp "$build_dir" com.saas.billing.PricingCalculatorTest
          java -cp "$build_dir" com.saas.billing.SubscriptionBillingServiceTest
